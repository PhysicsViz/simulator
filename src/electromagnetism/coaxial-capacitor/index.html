<!doctype html>
<!--
  index.html — Coaxial capacitor exercise page (electromagnetism theme).
  Layout: scene panel (canvas + legend), side column (transport + component
  toolbar + selection editor), formula and graph panels below. Text filled by
  main.js (FR/EN). Scripts are classic (non-module) tags for file:// support.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Câble coaxial — Physics Simulator</title>
    <link rel="stylesheet" href="../../../styles.css">
    <style>
      .exercise-page {
        max-width: 1240px;
        margin: 0 auto;
        padding: 18px 24px 48px;
      }

      .assumption {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 16px;
        align-items: stretch;
      }

      @media (max-width: 960px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      .scene-panel {
        position: relative;
        display: flex;
        flex-direction: column;
      }

      .scene-panel canvas {
        display: block;
        width: 100%;
        flex: 1;
        min-height: 420px;
        border-radius: 6px;
        cursor: crosshair;
        touch-action: none;
      }

      .zoom-controls {
        position: absolute;
        top: 26px;
        left: 26px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .zoom-controls button {
        width: 32px;
        height: 32px;
        padding: 0;
        font-size: 1.05rem;
        line-height: 1;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .legend-swatch {
        display: inline-block;
        width: 22px;
        height: 0;
        border-top: 3px solid currentColor;
      }

      .legend-swatch.field { color: #26a69a; }
      .legend-swatch.probe { color: #b8860b; }

      .parameter-row.parameter-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .parameter-row.parameter-toggle label {
        margin-bottom: 0;
      }

      .parameter-row input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
      }

      .parameter-row input:disabled {
        opacity: 0.45;
      }

      .parameter-row {
        margin-bottom: 14px;
      }

      .parameter-row label {
        display: block;
        font-size: 0.88rem;
        margin-bottom: 4px;
      }

      .legend {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        margin-top: 10px;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .side {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .side .control-panel {
        flex: 1;
      }

      #time_display {
        margin: 0 0 10px;
        font-size: 1.45rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      #timeline {
        width: 100%;
        margin-bottom: 12px;
      }

      .transport-buttons {
        display: flex;
        gap: 6px;
        margin-bottom: 14px;
      }

      .transport-buttons button {
        padding: 7px 10px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      #play_pause_button {
        flex: 1;
        min-width: 84px;
      }

      .speed-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .speed-row .speed-label {
        color: var(--muted);
        font-size: 0.82rem;
      }

      #speed_buttons {
        display: flex;
        gap: 5px;
      }

      #speed_buttons button {
        padding: 4px 9px;
        font-size: 0.85rem;
      }

      #tool_buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-bottom: 14px;
      }

      #tool_buttons button {
        padding: 6px 8px;
        font-size: 0.85rem;
      }

      .selection-title {
        margin: 0 0 8px;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .selection-type {
        margin: 0 0 8px;
        font-weight: 600;
      }

      .selection-hint {
        margin: 0;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .selection-delete {
        margin-top: 10px;
        color: #d32f2f;
      }

      #selection_rows button {
        width: 100%;
      }

      .parameter-row {
        margin-bottom: 10px;
      }

      .parameter-row input[type="range"] {
        width: 100%;
      }

      .value-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .value-wrap input[type="number"] {
        width: 92px;
      }

      .value-wrap .unit {
        color: var(--muted);
        font-size: 0.85rem;
      }

      .formula-panel,
      .graphs-panel {
        margin-top: 16px;
      }

      .formula-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 12px;
      }

      .formula-card {
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--background);
      }

      .formula-card .name {
        display: block;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 6px;
      }

      .formula-card .math {
        font-family: "Cambria Math", Cambria, Georgia, serif;
        font-size: 1.02rem;
        margin-bottom: 6px;
      }

      .formula-card .sub {
        font-size: 0.88rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        overflow-wrap: anywhere;
        height: 4.2em;
        overflow: hidden;
      }

      .formula-card .result {
        font-weight: 700;
        color: var(--accent);
        white-space: nowrap;
      }

      .graph-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 12px;
      }

      .graph-grid figure {
        margin: 0;
      }

      .graph-grid canvas {
        display: block;
        width: 100%;
        height: 210px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--background);
      }

      .graph-grid figcaption {
        margin-top: 6px;
        text-align: center;
        color: var(--muted);
        font-size: 0.82rem;
      }
    </style>
  </head>
  <body>
    <header class="app-bar">
      <a class="brand" href="../../../index.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 20 Q 12 -6 21 20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="16.7" cy="12.5" r="2.4" fill="currentColor"/>
        </svg>
        Physics Simulator
      </a>
      <span class="crumb" data-i18n="page_title"></span>
      <span class="spacer"></span>
      <button id="language_toggle" type="button">EN</button>
    </header>

    <main class="exercise-page">
      <p class="assumption" data-i18n="assumption"></p>

      <!-- GAME MODE (experimental) — mount point; to remove the feature delete the
           two GAME MODE blocks in this file, game.js, its test file, and the
           lines marked "Game mode hook" in main.js -->
      <div id="game_mode_mount"></div>

      <div class="layout">
        <section class="panel scene-panel">
          <canvas id="simulation_canvas" width="920" height="540"></canvas>
          <div class="zoom-controls">
            <button id="zoom_in_button" type="button">+</button>
            <button id="zoom_out_button" type="button">−</button>
            <button id="zoom_fit_button" type="button">⌖</button>
          </div>
          <div class="legend">
            <span class="legend-item"><span class="legend-swatch field"></span><span data-i18n="legend_field"></span></span>
            <span class="legend-item"><span class="legend-swatch probe"></span><span data-i18n="legend_probe"></span></span>
          </div>
        </section>

        <div class="side">
          <section class="panel control-panel">
            <h2 data-i18n="controls_title"></h2>
            <div id="parameter_rows"></div>
          </section>
        </div>
      </div>

      <section class="panel formula-panel">
        <h2 data-i18n="formulas_title"></h2>
        <div class="formula-grid">
          <div class="formula-card">
            <span class="name" data-i18n="formula_gauss"></span>
            <div class="math">∮ E⃗·dS⃗ = Q_int/ε₀ ⇒ E·2πrℓ = λℓ/ε₀</div>
            <div class="sub"><span id="sub_gauss"></span> · <span class="result" id="res_gauss"></span></div>
          </div>
          <div class="formula-card">
            <span class="name" data-i18n="formula_field"></span>
            <div class="math">E(r) = λ / (2π·ε₀·r)</div>
            <div class="sub"><span id="sub_field"></span> = <span class="result" id="res_field"></span></div>
          </div>
          <div class="formula-card">
            <span class="name" data-i18n="formula_potential"></span>
            <div class="math">V(r) = λ/(2π·ε₀)·ln(b/r)</div>
            <div class="sub"><span id="sub_potential"></span> = <span class="result" id="res_potential"></span></div>
          </div>
          <div class="formula-card">
            <span class="name" data-i18n="formula_difference"></span>
            <div class="math">V(a) − V(b) = λ/(2π·ε₀)·ln(b/a)</div>
            <div class="sub"><span id="sub_difference"></span> = <span class="result" id="res_difference"></span></div>
          </div>
          <div class="formula-card">
            <span class="name" data-i18n="formula_boundary"></span>
            <div class="math">E(a⁺) = σ_a/ε₀ ; E = 0 dans le métal</div>
            <div class="sub"><span id="sub_boundary"></span> = <span class="result" id="res_boundary"></span></div>
          </div>
          <div class="formula-card">
            <span class="name" data-i18n="formula_energy_density"></span>
            <div class="math">u(r) = ε₀·E(r)² / 2</div>
            <div class="sub"><span id="sub_energy_density"></span> = <span class="result" id="res_energy_density"></span></div>
          </div>
          <div class="formula-card">
            <span class="name" data-i18n="formula_capacitance"></span>
            <div class="math">C = 2π·ε₀·L / ln(b/a)</div>
            <div class="sub"><span id="sub_capacitance"></span> = <span class="result" id="res_capacitance"></span></div>
          </div>
          <div class="formula-card">
            <span class="name" data-i18n="formula_stored"></span>
            <div class="math">U = ½·C·(V_ab)²</div>
            <div class="sub"><span id="sub_stored"></span> = <span class="result" id="res_stored"></span></div>
          </div>
        </div>
      </section>

      <section class="panel graphs-panel">
        <h2 data-i18n="graphs_title"></h2>
        <div class="graph-grid">
          <figure>
            <canvas id="graph_field" width="400" height="210"></canvas>
            <figcaption data-i18n="graph_field"></figcaption>
          </figure>
          <figure>
            <canvas id="graph_potential" width="400" height="210"></canvas>
            <figcaption data-i18n="graph_potential"></figcaption>
          </figure>
          <figure>
            <canvas id="graph_energy" width="400" height="210"></canvas>
            <figcaption data-i18n="graph_energy"></figcaption>
          </figure>
        </div>
      </section>
    </main>

    <script src="../../assets/js/canvas_draw.js"></script>
    <script src="../../assets/js/scene_camera.js"></script>
    <script src="../../assets/js/graph_plot.js"></script>
    <script src="calcul.js"></script>
    <script src="main.js"></script>

    <!-- GAME MODE (experimental) — styles + script; see removal note at the mount point -->
    <style>
      .game-mode .formula-panel,
      .game-mode .graphs-panel,
      .game-mode #timeline,
      .game-mode #step_back_button,
      .game-mode #step_forward_button {
        display: none;
      }

      .mode-tabs {
        display: flex;
        gap: 6px;
        margin: 0 0 14px;
      }

      .game-panel {
        margin-top: 16px;
      }

      .game-panel .panel-head {
        display: flex;
        align-items: baseline;
        gap: 14px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }

      .game-panel .panel-head h2 {
        margin: 0;
      }

      .game-panel .panel-head button {
        margin-left: auto;
      }

      .game-panel .game-hint {
        color: var(--muted);
        font-size: 0.85rem;
      }

      .game-value {
        font-size: 1.35rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
      }

      .game-target-value {
        font-size: 0.98rem;
        font-weight: 600;
      }

      .game-sub {
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .game-sub:empty {
        display: none;
      }
    </style>
    <script src="game.js"></script>
  </body>
</html>
