<!doctype html>
<!--
  index.html — Spring–incline–pulley exercise page (mechanics theme).
  Layout: scene panel (canvas + legend), side column (transport + parameters),
  formula and graph panels below. Text filled by main.js (FR/EN).
  Scripts are classic (non-module) tags so the page works when opened via file://.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ressort, poulie et plan incliné — Physics Simulator</title>
    <link rel="stylesheet" href="../../../styles.css">
    <style>
      .exercise-page {
        max-width: 1240px;
        margin: 0 auto;
        padding: 18px 24px 48px;
      }

      .assumption {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 16px;
        align-items: stretch;
      }

      @media (max-width: 960px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      .scene-panel {
        position: relative;
        display: flex;
        flex-direction: column;
      }

      .scene-panel canvas {
        display: block;
        width: 100%;
        flex: 1;
        min-height: 420px;
        border-radius: 6px;
        cursor: grab;
        touch-action: none;
      }

      .scene-panel canvas:active {
        cursor: grabbing;
      }

      .zoom-controls {
        position: absolute;
        top: 26px;
        left: 26px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .zoom-controls button {
        width: 32px;
        height: 32px;
        padding: 0;
        font-size: 1.05rem;
        line-height: 1;
      }

      .legend {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        margin-top: 10px;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .legend-swatch {
        display: inline-block;
        width: 22px;
        height: 0;
        border-top: 3px solid currentColor;
      }

      .legend-swatch.weight { color: #d32f2f; }
      .legend-swatch.normal { color: #43a047; }
      .legend-swatch.tension { color: #8e24aa; }
      .legend-swatch.spring { color: #1976d2; }
      .legend-swatch.friction { color: #e8722c; }
      .legend-swatch.velocity { color: var(--foreground); border-top-style: dashed; }
      .legend-swatch.acceleration { color: var(--foreground); border-top-style: dotted; }

      .side {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .side .control-panel {
        flex: 1;
      }

      #time_display {
        margin: 0 0 10px;
        font-size: 1.45rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      #timeline {
        width: 100%;
        margin-bottom: 12px;
      }

      .transport-buttons {
        display: flex;
        gap: 6px;
        margin-bottom: 14px;
      }

      .transport-buttons button {
        padding: 7px 10px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      #play_pause_button {
        flex: 1;
        min-width: 84px;
      }

      .speed-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .speed-row .speed-label {
        color: var(--muted);
        font-size: 0.82rem;
      }

      #speed_buttons {
        display: flex;
        gap: 5px;
      }

      #speed_buttons button {
        padding: 4px 9px;
        font-size: 0.85rem;
      }

      .parameter-row {
        margin-bottom: 14px;
      }

      .parameter-row:last-child {
        margin-bottom: 0;
      }

      .parameter-row label {
        display: block;
        font-size: 0.88rem;
        margin-bottom: 4px;
      }

      .parameter-row input[type="range"] {
        width: 100%;
      }

      .parameter-row input:disabled {
        opacity: 0.45;
      }

      .value-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .value-wrap input[type="number"] {
        width: 92px;
      }

      .value-wrap .unit {
        color: var(--muted);
        font-size: 0.85rem;
      }

      .formula-panel,
      .graphs-panel {
        margin-top: 16px;
      }

      .formula-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 12px;
      }

      .formula-card {
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--background);
      }

      .formula-card .name {
        display: block;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 6px;
      }

      .formula-card .math {
        font-family: "Cambria Math", Cambria, Georgia, serif;
        font-size: 1.02rem;
        margin-bottom: 6px;
      }

      .formula-card .sub {
        font-size: 0.88rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        overflow-wrap: anywhere;
        height: 4.2em;
        overflow: hidden;
      }

      .formula-card .result {
        font-weight: 700;
        color: var(--accent);
        white-space: nowrap;
      }

      .graph-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 12px;
      }

      .graph-grid figure {
        margin: 0;
      }

      .graph-grid canvas {
        display: block;
        width: 100%;
        height: 210px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--background);
      }

      .graph-grid figcaption {
        margin-top: 6px;
        text-align: center;
        color: var(--muted);
        font-size: 0.82rem;
      }
    </style>
  </head>
  <body>
    <header class="app-bar">
      <a class="brand" href="../../../index.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 20 Q 12 -6 21 20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="16.7" cy="12.5" r="2.4" fill="currentColor"/>
        </svg>
        Physics Simulator
      </a>
      <span class="crumb" data-i18n="page_title"></span>
      <span class="spacer"></span>
      <button id="language_toggle" type="button">EN</button>
    </header>

    <main class="exercise-page">
      <p class="assumption" data-i18n="assumption"></p>

      <!-- GAME MODE (experimental) — mount point; to remove the feature delete the
           two GAME MODE blocks in this file, game.js, its test file, and the
           lines marked "Game mode hook" in main.js -->
      <div id="game_mode_mount"></div>

      <div class="layout">
        <section class="panel scene-panel">
          <canvas id="simulation_canvas" width="920" height="540"></canvas>
          <div class="zoom-controls">
            <button id="zoom_in_button" type="button">+</button>
            <button id="zoom_out_button" type="button">−</button>
            <button id="zoom_fit_button" type="button">⌖</button>
          </div>
          <div class="legend">
            <span class="legend-item"><span class="legend-swatch weight"></span><span data-i18n="legend_weight"></span></span>
            <span class="legend-item"><span class="legend-swatch normal"></span><span data-i18n="legend_normal"></span></span>
            <span class="legend-item"><span class="legend-swatch tension"></span><span data-i18n="legend_tension"></span></span>
            <span class="legend-item"><span class="legend-swatch spring"></span><span data-i18n="legend_spring"></span></span>
            <span class="legend-item"><span class="legend-swatch friction"></span><span data-i18n="legend_friction"></span></span>
            <span class="legend-item"><span class="legend-swatch velocity"></span><span data-i18n="legend_velocity"></span></span>
            <span class="legend-item"><span class="legend-swatch acceleration"></span><span data-i18n="legend_acceleration"></span></span>
          </div>
        </section>

        <div class="side">
          <section class="panel transport-panel">
            <h2 data-i18n="transport_title"></h2>
            <p id="time_display">t = 0,00 s</p>
            <input id="timeline" type="range" min="0" max="1" step="0.01" value="0">
            <div class="transport-buttons">
              <button id="reset_button" type="button" data-i18n="reset"></button>
              <button id="step_back_button" type="button" data-i18n="step_back"></button>
              <button id="play_pause_button" type="button" class="primary"></button>
              <button id="step_forward_button" type="button" data-i18n="step_forward"></button>
            </div>
            <div class="speed-row">
              <span class="speed-label" data-i18n="speed_label"></span>
              <span id="speed_buttons"></span>
            </div>
          </section>

          <section class="panel control-panel">
            <h2 data-i18n="controls_title"></h2>
            <div id="parameter_rows"></div>
          </section>
        </div>
      </div>

      <section class="panel formula-panel">
        <h2 data-i18n="formulas_title"></h2>
        <div class="formula-grid">
          <div class="formula-card">
            <span class="name" data-i18n="formula_energy"></span>
            <div class="math">½·(m₁+m₂)·v² = m₂·g·d − m₁·g·sinθ·d − ½·k·d² − µ·m₁·g·cosθ·d</div>
            <div class="sub"><span id="sub_energy"></span> → <span class="result" id="res_energy"></span></div>
          </div>
          <div class="formula-card">
            <span class="name" data-i18n="formula_motor"></span>
            <div class="math">W_moteur = m₂·g·d</div>
            <div class="sub"><span id="sub_motor"></span> = <span class="result" id="res_motor"></span></div>
          </div>
          <div class="formula-card">
            <span class="name" data-i18n="formula_resist"></span>
            <div class="math">m₁·g·sinθ·d + ½·k·d² + µ·N·d</div>
            <div class="sub"><span id="sub_resist"></span> = <span class="result" id="res_resist"></span></div>
          </div>
          <div class="formula-card">
            <span class="name" data-i18n="formula_normal"></span>
            <div class="math">N = m₁·g·cos θ · f = µ·N</div>
            <div class="sub"><span id="sub_normal"></span> = <span class="result" id="res_normal"></span></div>
          </div>
          <div class="formula-card">
            <span class="name" data-i18n="formula_omega"></span>
            <div class="math">ω = √(k / (m₁+m₂))</div>
            <div class="sub"><span id="sub_omega"></span> = <span class="result" id="res_omega"></span></div>
          </div>
          <div class="formula-card">
            <span class="name" data-i18n="formula_damping"></span>
            <div class="math">Δx = 2·f/k</div>
            <div class="sub"><span id="sub_damping"></span> = <span class="result" id="res_damping"></span></div>
          </div>
          <div class="formula-card">
            <span class="name" data-i18n="formula_rest"></span>
            <div class="math">|F − k·x| ≤ f ⇒ v ≡ 0</div>
            <div class="sub"><span id="sub_rest"></span> → <span class="result" id="res_rest"></span></div>
          </div>
          <div class="formula-card">
            <span class="name" data-i18n="formula_tension"></span>
            <div class="math">T = m₂·(g − a)</div>
            <div class="sub"><span id="sub_tension"></span> = <span class="result" id="res_tension"></span></div>
          </div>
          <div class="formula-card">
            <span class="name" data-i18n="formula_acceleration"></span>
            <div class="math">a = (F + f_signé − k·x) / (m₁+m₂)</div>
            <div class="sub"><span id="sub_acceleration"></span> = <span class="result" id="res_acceleration"></span></div>
          </div>
        </div>
      </section>

      <section class="panel graphs-panel">
        <h2 data-i18n="graphs_title"></h2>
        <div class="graph-grid">
          <figure>
            <canvas id="graph_position" width="400" height="210"></canvas>
            <figcaption data-i18n="graph_position"></figcaption>
          </figure>
          <figure>
            <canvas id="graph_velocity" width="400" height="210"></canvas>
            <figcaption data-i18n="graph_velocity"></figcaption>
          </figure>
          <figure>
            <canvas id="graph_acceleration" width="400" height="210"></canvas>
            <figcaption data-i18n="graph_acceleration"></figcaption>
          </figure>
        </div>
      </section>
    </main>

    <script src="../../assets/js/canvas_draw.js"></script>
    <script src="../../assets/js/scene_camera.js"></script>
    <script src="../../assets/js/graph_plot.js"></script>
    <script src="calcul.js"></script>
    <script src="main.js"></script>

    <!-- GAME MODE (experimental) — styles + script; see removal note at the mount point -->
    <style>
      .game-mode .formula-panel,
      .game-mode .graphs-panel,
      .game-mode #timeline,
      .game-mode #step_back_button,
      .game-mode #step_forward_button,
      .game-mode #row_drop_distance {
        display: none;
      }

      .mode-tabs {
        display: flex;
        gap: 6px;
        margin: 0 0 14px;
      }

      .game-panel {
        margin-top: 16px;
      }

      .game-panel .panel-head {
        display: flex;
        align-items: baseline;
        gap: 14px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }

      .game-panel .panel-head h2 {
        margin: 0;
      }

      .game-panel .panel-head button {
        margin-left: auto;
      }

      .game-panel .game-hint {
        color: var(--muted);
        font-size: 0.85rem;
      }

      .game-value {
        font-size: 1.35rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
      }

      .game-target-value {
        font-size: 0.98rem;
        font-weight: 600;
      }

      .game-sub {
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .game-sub:empty {
        display: none;
      }
    </style>
    <script src="game.js"></script>
  </body>
</html>
