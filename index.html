<!doctype html>
<!--
  index.html — Home page: app shell listing every simulation, grouped by theme.
  FR/EN toggle persisted in localStorage (shared with exercise pages).
-->
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Physics Simulator</title>
    <meta name="description" content="Simulations interactives de physique — Physique 1, BAC1 ingénieur civil.">
    <link rel="stylesheet" href="styles.css">
    <style>
      .home {
        max-width: 1060px;
        margin: 0 auto;
        padding: 40px 24px 64px;
      }

      .hero h1 {
        margin: 0;
        font-size: clamp(1.9rem, 5vw, 2.9rem);
        letter-spacing: -0.02em;
        line-height: 1.1;
      }

      .hero p {
        margin: 14px 0 0;
        max-width: 640px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.65;
      }

      .theme-section {
        margin-top: 44px;
      }

      .theme-section > h2 {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 16px;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .theme-section > h2::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 16px;
      }

      .card {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 20px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow);
        text-decoration: none;
        color: var(--foreground);
        transition: transform 0.14s, border-color 0.14s;
      }

      .card:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
      }

      .card .icon {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        color: var(--accent);
      }

      .card h3 {
        margin: 0;
        font-size: 1.15rem;
      }

      .card p {
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.55;
        flex: 1;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .tag {
        padding: 2px 9px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--accent) 10%, transparent);
        color: var(--accent);
        font-size: 0.74rem;
        font-weight: 600;
      }

      .card .open {
        color: var(--accent);
        font-size: 0.9rem;
        font-weight: 600;
      }

      .card.upcoming {
        border-style: dashed;
        box-shadow: none;
        opacity: 0.75;
      }

      .card.upcoming:hover {
        transform: none;
        border-color: var(--border);
      }

      .home-footer {
        margin-top: 56px;
        padding-top: 18px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.85rem;
      }
    </style>
  </head>
